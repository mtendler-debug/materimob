<!-- Supabase > Authentication > Emails > Templates > Confirm sign up
     Assunto: Confirme o seu cadastro no MaterImob -->
<div style="font-family:Inter,-apple-system,'Segoe UI',Arial,sans-serif;max-width:460px;margin:0 auto;padding:28px 20px;color:#334155">
  <p style="margin:0 0 20px;font-size:18px;font-weight:800;color:#1e293b">MaterImob</p>
  <h1 style="margin:0 0 12px;font-size:20px;color:#1e293b">Confirme o seu cadastro</h1>
  <p style="margin:0 0 20px;font-size:15px;line-height:1.55">Falta só um passo para usar a sua conta <strong>{{ .Email }}</strong>. Clique no botão para confirmar o e-mail.</p>
  <p style="margin:0 0 24px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1e293b;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:12px 22px;border-radius:10px">Confirmar meu e-mail</a></p>
  <p style="margin:0 0 8px;font-size:13px;line-height:1.5;color:#64748b">Se você não criou esta conta, ignore este e-mail.</p>
  <p style="margin:0;font-size:12px;color:#94a3b8">MaterImob · materimob.com.br</p>
</div>
